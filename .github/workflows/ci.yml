name: CI

# Runs only when asked. Actions minutes on a private repository are billed, and every check
# here is one that has to pass locally before a push anyway. Make the repository public and
# this can go back to running on every push for nothing.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
