name: Deployed

# CI proves the code is sound. This proves it reached the site: the build stamps the commit it
# came from into version.json, and this waits for that commit to be the one being served.
# A deploy that never happened is otherwise indistinguishable from one that did.

on:
  push:
    branches: [main]

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the site to serve this commit
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fsS --max-time 10 "https://tuval.dev/version.json?t=$i" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Serving $GITHUB_SHA after $((i * 15))s"
              exit 0
            fi
            echo "still on ${live:-unknown}"
            sleep 15
          done
          echo "::error::tuval.dev is still not serving $GITHUB_SHA. The build likely failed; check Workers Builds."
          exit 1
